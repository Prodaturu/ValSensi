<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ValSensi</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0b0d12;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0b0d12;
        font-family: Arial, sans-serif;
      }

      .calibration-area {
        position: relative;
        display: grid;
        place-items: center;
        width: min(1080px, 100vw, calc(100dvh * 54 / 31));
        aspect-ratio: 54 / 31;
        border: 2px solid #6f7d98;
        background: #141923;
        color: #c7d1e1;
      }

      .calibration-area__label {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .movement-readout {
        position: absolute;
        bottom: 10px;
        left: 10px;
        margin: 0;
        color: #8e9bb1;
        font: 11px/1.5 monospace;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <main class="calibration-area" aria-label="Calibration Area">
      <p class="calibration-area__label">Calibration Area</p>
      <p class="movement-readout" aria-live="polite">movementX: 0
movementY: 0
cumulativeX: 0
cumulativeY: 0</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
